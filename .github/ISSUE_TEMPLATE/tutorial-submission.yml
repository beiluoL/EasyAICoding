name: 🛠 Tutorial Submission
description: 提交一个新的入门教程
title: "[Tutorial] "
labels: ["tutorial"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你贡献教程！请先阅读 [教程质量标准](https://github.com/你的用户名/EasyAICoding/blob/main/docs/contribution/content-quality.md)。
  - type: input
    id: title
    attributes:
      label: 教程标题
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 你要做什么
      description: 一句话说明这个教程的产出
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 最终会得到什么
      description: 做完之后用户拥有什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 步骤大纲
      description: Step 1 / Step 2 / ... 列出大纲即可
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification（验证）
      description: 教程每一步实际跑过吗？结果如何？如果没有，请写 Not Yet Verified。
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 教程面向零基础用户，术语有解释
          required: true
        - label: 教程中没有任何敏感信息
          required: true
