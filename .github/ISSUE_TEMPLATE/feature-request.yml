name: ✨ Feature Request
description: 建议新的内容、功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请先搜索是否已有人提过相同需求。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 你希望帮助小白解决什么？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议的方案
      description: 你希望新增什么内容或改进什么？
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 优先级建议
      options:
        - P0（很紧急）
        - P1（重要）
        - P2（可以以后做）
        - P3（锦上添花）
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过是否已有相同 Issue
          required: true
